
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coolze AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #202438;
    }

    .app {
      max-width: 900px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #e8eaf1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 5px 0 0;
      color: #858ba0;
      font-size: 13px;
    }

    #clearBtn {
      border: 1px solid #e1e4ed;
      background: white;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 440px;
      padding: 30px 10px;
    }

    .welcome .logo {
      font-size: 42px;
    }

    .welcome h2 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #858ba0;
      line-height: 1.8;
    }

    .message {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #635bff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: #f0f2f8;
      color: #202438;
      border-bottom-left-radius: 4px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 18px 24px 24px;
      border-top: 1px solid #e8eaf1;
    }

    #input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dfe3ed;
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
      outline: none;
    }

    #input:focus {
      border-color: #635bff;
    }

    #sendBtn {
      border: none;
      border-radius: 14px;
      padding: 0 23px;
      background: #635bff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #5148eb;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px;
      }

      #messages {
        padding: 20px 15px;
      }

      form {
        padding: 14px;
      }

      .message {
        max-width: 90%;
      }

      #sendBtn {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>✦ Coolze AI</h1>
        <p>你的个人 AI 助手</p>
      </div>
      <button id="clearBtn">清空对话</button>
    </header>

    <main id="messages">
      <div class="welcome" id="welcome">
        <div class="logo">✦</div>
        <h2>有什么可以帮你？</h2>
        <p>输入你的问题，开始一段新的对话吧。</p>
      </div>
    </main>

    <form id="chatForm">
      <input
        id="input"
        type="text"
        placeholder="给 Coolze AI 发送消息..."
        autocomplete="off"
      >
      <button id="sendBtn" type="submit">发送 ↑</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const clearBtn = document.getElementById("clearBtn");

const savedMessages = localStorage.getItem("chatHistory");

if (savedMessages) {
  messages.innerHTML = savedMessages;
}

    function addMessage(text, role) {
      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      const message = document.createElement("div");
      message.className = "message " + role;
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
      saveMessages();
    }
    function saveMessages() {
  localStorage.setItem("chatHistory", messages.innerHTML);
}

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      addMessage(text, "user");
      input.value = "";
      input.focus();

      setTimeout(function() {
        addMessage(
          "我收到了你的消息：“" + text +
          "”\n\n目前我还是模拟版 AI。下一步，我们会接入真正的大模型 API！",
          "ai"
        );
      }, 500);
    });

    clearBtn.addEventListener("click", function() {
      messages.innerHTML = `
        <div class="welcome" id="welcome">
          <div class="logo">✦</div>
          <h2>有什么可以帮你？</h2>
          <p>输入你的问题，开始一段新的对话吧。</p>
        </div>
      `;
      localStorage.removeItem("chatHistory");
    });
  </script>
</body>
</html>
